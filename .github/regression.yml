name: Nightly Regression

on:
  schedule:
    - cron: "2 2 * * *" # 01:00 UTC daily
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run REGRESSION
        env:
          BASE_URL: https://spacetravelers-64xw.onrender.com
        run: npm run test:regression

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report   --project=${{ matrix.browser }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 7

      - name: Upload traces / videos (if present)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.browser }}
          path: |
            test-results
            playwright-report/data
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize failure in run summary
        if: failure()
        run: |
          {
            echo "## ❌ Nightly Regression Failed – ${{ matrix.browser }}"
            echo ""
            echo "**Repo:** ${{ github.repository }}"
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "- Open workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Download HTML report artifact: \`playwright-report-${{ matrix.browser }}\`"
            echo "- (If configured) Traces/videos: \`test-artifacts-${{ matrix.browser }}\`"
          } >> "$GITHUB_STEP_SUMMARY"