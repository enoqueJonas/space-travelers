name: Smoke On Staging

on:
  push:
    branches: [ dev ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout app (this repo)
        uses: actions/checkout@v4

      - name: Checkout tests repo
        uses: actions/checkout@v4
        with:
          repository: enoqueJonas/demo-e2e-ui-playwright-
          path: tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tests deps
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps

      - name: Warm up Render (optional)
        run: |
          curl -sS --retry 6 --retry-all-errors --max-time 10 \
            https://spacetravelers-64xw.onrender.com/ > /dev/null || true

      - name: Run SMOKE tests
        working-directory: tests
        env:
          BASE_URL: https://spacetravelers-64xw.onrender.com
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report

      - name: Notify Teams on Failure
        if: steps.tests.outcome == 'failure'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          PAYLOAD=$(cat <<EOF
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "EA4300",
            "summary": "Smoke failed",
            "title": "Smoke tests failed",
            "sections": [{
              "facts": [
                { "name": "Repo", "value": "${{ github.repository }}" },
                { "name": "Branch", "value": "${BRANCH}" },
                { "name": "Commit", "value": "${COMMIT}" }
              ],
              "text": "Smoke tests failed. See run: ${RUN_URL}"
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "View CI Run",
              "targets": [{ "os": "default", "uri": "${RUN_URL}" }]
            }]
          }
          EOF
          )
          curl -H 'Content-Type: application/json' -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"

      - name: Fail job (if tests failed)
        if: steps.tests.outcome == 'failure'
        run: exit 1 